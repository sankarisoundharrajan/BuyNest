    <title>BuyNest - Products</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f6f7fb;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================= */

        nav {
            min-height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff4f81;
        }

        nav div:last-child {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #333;
            margin-left: 25px;
            font-weight: 600;
        }

        nav a:hover {
            color: #ff4f81;
        }

        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 36px;
        }

        .title p {
            color: #777;
            margin-top: 8px;
        }

        /* =========================
           PRODUCTS
        ========================= */

        .products {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow:
                0 5px 20px rgba(0,0,0,.08);
            transition: .3s;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            display: block;
            background: #f1f1f1;
        }

        /* =========================
           WISHLIST
        ========================= */

        .wishlist-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 50%;
            background: white;
            font-size: 23px;
            cursor: pointer;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                0 3px 10px rgba(0,0,0,.15);
            transition: .2s;
        }

        .wishlist-btn:hover {
            transform: scale(1.12);
        }

        .wishlist-btn.liked {
            color: #ff2f68;
        }

        /* =========================
           CARD CONTENT
        ========================= */

        .card-content {
            padding: 18px;
        }

        .card h3 {
            margin-bottom: 8px;
            font-size: 18px;
        }

        .category {
            color: #888;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .price {
            color: #ff4f81;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            background: #ff4f81;
            color: white;
        }

        .btn:hover {
            background: #e83e70;
        }

        /* =========================
           NO PRODUCTS
        ========================= */

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            background: white;
            padding: 60px 20px;
            border-radius: 15px;
            color: #777;
            font-size: 18px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media(max-width:600px) {

            nav {
                padding: 12px 4%;
                flex-direction: column;
                gap: 12px;
            }

            nav div:last-child {
                justify-content: center;
                gap: 8px;
            }

            nav a {
                margin-left: 5px;
                font-size: 12px;
            }

            .logo {
                font-size: 22px;
            }

            .products {
                grid-template-columns:
                    repeat(2, 1fr);
                gap: 12px;
            }

            .card img {
                height: 220px;
            }

            .card-content {
                padding: 12px;
            }

            .card h3 {
                font-size: 15px;
            }

            .price {
                font-size: 18px;
            }

            .wishlist-btn {
                width: 36px;
                height: 36px;
                font-size: 20px;
            }

        }

    </style>

</head>

        /* =========================================
           PRODUCTS CONTAINER
        ========================================= */

        const productsContainer =
            document.getElementById("products");


        /* =========================================
           CATEGORY FILTER
        ========================================= */

        const selectedCategory =
            new URLSearchParams(
                window.location.search
            ).get("category");


        const filteredProducts =
            selectedCategory

                ? products.filter(product =>
                    product.category
                        .toLowerCase()
                        .includes(
                            selectedCategory.toLowerCase()
                        )
                )

                : products;


        /* =========================================
           GET WISHLIST
        ========================================= */

        function getWishlist() {

            return JSON.parse(
                localStorage.getItem(
                    "buynestWishlist"
                )
            ) || [];

        }


        /* =========================================
           SAVE WISHLIST
        ========================================= */

        function saveWishlist(wishlist) {

            localStorage.setItem(
                "buynestWishlist",
                JSON.stringify(wishlist)
            );

        }


        /* =========================================
           CHECK WISHLIST
        ========================================= */

        function isInWishlist(id) {

            const wishlist =
                getWishlist();

            return wishlist.some(
                item =>
                    String(item.id) === String(id)
            );

        }


        /* =========================================
           TOGGLE WISHLIST
        ========================================= */

        function toggleWishlist(id) {

            let wishlist =
                getWishlist();


            const product =
                products.find(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            if (!product) {
                return;
            }


            const existingIndex =
                wishlist.findIndex(
                    item =>
                        String(item.id) ===
                        String(id)
                );


            /* REMOVE */

            if (existingIndex !== -1) {

                wishlist.splice(
                    existingIndex,
                    1
                );

            }


            /* ADD */

            else {

                wishlist.push({

                    id: product.id,

                    name: product.name,

                    category: product.category,

                    price: product.price,

                    image: product.image

                });

            }


            saveWishlist(wishlist);

            renderProducts();

        }


        /* =========================================
           RENDER PRODUCTS
        ========================================= */

        function renderProducts() {

            productsContainer.innerHTML = "";


            if (
                filteredProducts.length === 0
            ) {

                productsContainer.innerHTML = `

                    <div class="no-products">

                        No products found
                        for this category.

                    </div>

                `;

                return;
            }


            filteredProducts.forEach(
                product => {


                    const liked =
                        isInWishlist(
                            product.id
                        );


                    productsContainer.innerHTML += `

                        <div class="card">


                            <!-- WISHLIST -->

                            <button

                                class="wishlist-btn
                                ${liked ? "liked" : ""}"

                                onclick="
                                    toggleWishlist(
                                        ${product.id}
                                    )
                                "

                                title="${
                                    liked
                                        ? "Remove from Wishlist"
                                        : "Add to Wishlist"
                                }"

                            >

                                ${liked ? "❤️" : "♡"}

                            </button>


                            <!-- PRODUCT IMAGE -->

                            <img

                                src="${product.image}"

                                alt="${product.name}"

                                loading="lazy"

                                onerror="
                                    this.onerror=null;
                                    this.src='profile-default.png';
                                "

                            >


                            <!-- CARD CONTENT -->

                            <div class="card-content">


                                <div class="category">

                                    ${product.category}

                                </div>


                                <h3>

                                    ${product.name}

                                </h3>


                                <div class="price">

                                    ₹${product.price.toLocaleString("en-IN")}

                                </div>


                                <button

                                    class="btn"

                                    onclick="
                                        viewProduct(
                                            ${product.id}
                                        )
                                    "

                                >

                                    View Product

                                </button>


                            </div>

                        </div>

                    `;

                }
            );

        }


        /* =========================================
           VIEW PRODUCT
        ========================================= */

        function viewProduct(id) {

            window.location.href =
                `product.html?id=${id}`;

        }


        /* =========================================
           INITIAL LOAD
        ========================================= */

        renderProducts();

    </script>
