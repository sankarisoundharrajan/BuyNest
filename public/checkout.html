<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BuyNest - Checkout</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial;
}

body {
    background: #f5f6fa;
}

nav {
    height: 70px;
    background: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 7%;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.logo {
    font-size: 28px;
    font-weight: bold;
    color: #ff4f81;
}

nav a {
    text-decoration: none;
    color: #333;
    margin-left: 20px;
}

.container {
    width: 90%;
    max-width: 1000px;
    margin: 40px auto;
}

.checkout-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.box {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,.06);
}

h2 {
    margin-bottom: 20px;
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 8px;
    margin-bottom: 15px;
}

.item {
    display: flex;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid #eee;
}

.total {
    font-size: 23px;
    font-weight: bold;
    color: #ff4f81;
    margin-top: 20px;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    background: #ff4f81;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 20px;
}

button:hover {
    background: #e83e70;
}

.success {
    display: none;
    background: #e8fff0;
    color: green;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

.error {
    color: red;
    margin-top: 15px;
}

@media(max-width:700px) {

    .checkout-box {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<nav>

    <div class="logo">BuyNest</div>

    <div>
        <a href="products.html">Products</a>
        <a href="cart.html">🛒 Cart</a>
        <a href="orders.html">📦 Orders</a>
    </div>

</nav>

<div class="container">

    <h1>Checkout</h1>

    <br>

    <div class="checkout-box">

        <div class="box">

            <h2>Customer Details</h2>

            <input
                type="text"
                id="name"
                placeholder="Full Name">

            <input
                type="email"
                id="email"
                placeholder="Email Address">

            <input
                type="text"
                id="phone"
                placeholder="Phone Number">

            <input
                type="text"
                id="address"
                placeholder="Delivery Address">

            <button onclick="placeOrder()">
                🛍 Place Order
            </button>

            <div
                class="error"
                id="error">
            </div>

            <div
                class="success"
                id="success">
            </div>

        </div>

        <div class="box">

            <h2>Order Summary</h2>

            <div id="summary"></div>

            <div
                class="total"
                id="total">
            </div>

        </div>

    </div>

</div>

<script>

let cart =
    JSON.parse(
        localStorage.getItem("buynestCart")
    ) || [];

const user =
    JSON.parse(
        localStorage.getItem("buynestUser")
    ) || null;

// Automatically fill registered user
if (user) {

    document.getElementById("name").value =
        user.name || "";

    document.getElementById("email").value =
        user.email || "";

}

function showSummary() {

    const summary =
        document.getElementById("summary");

    if (cart.length === 0) {

        summary.innerHTML =
            "<p>Your cart is empty.</p>";

        return;

    }

    let total = 0;

    summary.innerHTML = "";

    cart.forEach(item => {

        const itemTotal =
            item.price * item.quantity;

        total += itemTotal;

        summary.innerHTML += `

            <div class="item">

                <span>
                    ${item.name}
                    × ${item.quantity}
                </span>

                <strong>
                    ₹${itemTotal.toLocaleString("en-IN")}
                </strong>

            </div>

        `;

    });

    document.getElementById("total").textContent =
        "Total: ₹" +
        total.toLocaleString("en-IN");

}

async function placeOrder() {

    const name =
        document.getElementById("name").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const address =
        document.getElementById("address").value.trim();

    const error =
        document.getElementById("error");

    const success =
        document.getElementById("success");

    error.textContent = "";

    success.style.display = "none";

    if (!name || !email || !phone || !address) {

        error.textContent =
            "Please fill all customer details.";

        return;
    }

    if (cart.length === 0) {

        error.textContent =
            "Your cart is empty.";

        return;
    }

    try {

        // Create every cart item as an order
        for (const item of cart) {

            const response =
                await fetch("/api/orders", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        customer_name: name,

                        customer_email: email,

                        product_name: item.name,

                        product_image: item.image,

                        quantity: item.quantity,

                        price: item.price

                    })

                });

            const data =
                await response.json();

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Order failed"
                );

            }

        }

        // Clear cart after successful order
        localStorage.removeItem("buynestCart");

        success.style.display = "block";

        success.innerHTML = `
            <h3>🎉 Order Placed Successfully!</h3>
            <p>Your order has been saved.</p>
            <br>
            <a href="orders.html">
                View My Orders →
            </a>
        `;

        cart = [];

    } catch (err) {

        console.error(err);

        error.textContent =
            "❌ Unable to place order. Make sure the server is running.";

    }

}

showSummary();

</script>

</body>
</html>
