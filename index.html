<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BuyNest - Fashion For Everyone</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#101b3d}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}
.header{height:74px;border-bottom:1px solid #e8ebf2;display:flex;align-items:center;padding:0 42px;gap:30px;background:#fff;position:sticky;top:0;z-index:1000}
.logo-area{width:280px;display:flex;align-items:center;gap:10px}
.logo-bag{width:30px;height:34px;background:linear-gradient(135deg,#e60073,#ff2c8c);border-radius:4px;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.logo-bag::before{content:"";position:absolute;width:12px;height:9px;border:3px solid #e60073;border-bottom:0;border-radius:10px 10px 0 0;top:-7px}
.logo-text h1{font-size:25px;line-height:22px;color:#101b3d}
.logo-text h1 span{color:#e00076}
.logo-text p{font-size:11px;color:#65708d;margin-top:3px}
.search-box{height:44px;border:1px solid #dce2ee;border-radius:25px;display:flex;align-items:center;padding:0 15px;flex:1;max-width:785px;background:#fbfcff}
.search-box>i{font-size:22px;color:#53617e}
.search-box input{border:0;outline:0;background:transparent;flex:1;padding:0 14px;font-size:16px;color:#17213f}
.search-box input::placeholder{color:#8290ad}
.search-icons{display:flex;gap:20px}
.search-icons i{cursor:pointer;color:#53617e;font-size:20px}
.header-actions{display:flex;align-items:center;gap:25px;margin-left:auto}
.profile{width:44px;height:44px;border-radius:50%;overflow:hidden;border:2px solid #ffd46a;background:#f8f8f8}
.profile img{width:100%;height:100%;object-fit:cover}
.header-icon{font-size:28px;color:#080d19;position:relative;cursor:pointer}
.notification-dot{position:absolute;width:9px;height:9px;background:#e00076;border-radius:50%;right:-2px;top:0}
.cart-count{position:absolute;top:-10px;right:-10px;width:23px;height:23px;border-radius:50%;background:#df0878;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:bold}
.main{padding:16px 42px 100px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.section-title h2{font-size:25px;color:#090909}
.see-all{color:#df0878;font-size:16px;font-weight:600}
.categories-wrapper{overflow:hidden}
.categories{display:grid;grid-template-columns:repeat(9,1fr);column-gap:24px;row-gap:18px}
.category{text-align:center;cursor:pointer}
.category-image{width:120px;height:120px;border-radius:50%;margin:auto;overflow:hidden;background:#f2f3fa}
.category-image img{width:100%;height:100%;object-fit:cover;transition:.3s}
.category:hover img{transform:scale(1.06)}
.category p{margin-top:7px;font-size:15px;font-weight:500;color:#101b3d;white-space:nowrap}

.filter-area{margin-top:16px;border-top:1px solid #e5e8ef;padding-top:10px;display:flex;align-items:center;justify-content:space-between}
.filter-left{display:flex;gap:12px}
.filter-box{position:relative}
.filter-btn{height:42px;min-width:145px;border:1px solid #dde3ef;border-radius:24px;background:#fff;color:#101b3d;font-size:15px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer}
.filter-btn i{font-size:18px}
.filter-dropdown{position:absolute;top:50px;left:0;width:235px;max-height:340px;overflow:auto;background:#fff;border:1px solid #dde3ef;border-radius:14px;box-shadow:0 12px 30px rgba(16,27,61,.14);padding:8px;display:none;z-index:3000}
.filter-dropdown.show{display:block}
.filter-option{width:100%;border:0;background:#fff;text-align:left;padding:12px 13px;border-radius:9px;color:#101b3d;font-size:14px;cursor:pointer}
.filter-option:hover,.filter-option.active{background:#fff0f7;color:#df0878}
.gender-option{padding-left:13px}
.trending{margin-top:16px}
.trending-title{margin-bottom:12px}
.trending-title h2{font-size:27px;color:#101b3d}
.products{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.product{border:1px solid #e3e6ed;border-radius:7px;overflow:hidden;background:#fff;transition:.25s;min-width:0}
.product:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(20,30,70,.10)}
.product-image{height:132px;position:relative;overflow:hidden;background:#f3f3f3}
.product-image img{width:100%;height:100%;object-fit:cover;object-position:center top;cursor:pointer}
.wishlist{position:absolute;right:8px;top:8px;width:29px;height:29px;border:0;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.wishlist.active i{color:#e00076}
.product-info{padding:8px 12px}
.product-name{font-size:15px;font-weight:500;color:#0e1938;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:13px}
.rating i{color:#ffb900}
.rating-number{color:#e19b00}
.reviews{color:#78839c}
.price{margin-top:4px;font-size:17px;font-weight:600;color:#17213f}
.old-price{color:#737b8d;text-decoration:line-through;font-size:13px;margin-left:5px;font-weight:normal}
.discount{display:inline-block;background:#e90076;color:#fff;padding:4px 8px;border-radius:3px;font-size:12px;font-weight:bold;margin-top:5px}
.no-products{grid-column:1/-1;text-align:center;padding:55px 20px;border:1px dashed #dce2ee;border-radius:12px;color:#65708d}
.no-products h3{color:#101b3d;margin-bottom:7px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(255,255,255,.98);border-top:1px solid #e1e5ee;display:flex;justify-content:space-around;align-items:center;z-index:2000}
.bottom-item{text-align:center;color:#465579;font-size:13px;cursor:pointer}
.bottom-item i{display:block;font-size:23px;margin-bottom:4px}
.bottom-item.active{color:#dc0875}
@media(max-width:1200px){.header{padding:0 25px}.main{padding-left:25px;padding-right:25px}.logo-area{width:200px}.categories{grid-template-columns:repeat(6,1fr)}.products{grid-template-columns:repeat(4,1fr)}}
@media(max-width:900px){.header{height:auto;min-height:70px;flex-wrap:wrap;padding:12px 20px;gap:12px}.logo-area{width:auto;flex:1}.search-box{order:3;max-width:none;flex-basis:100%}.header-actions{gap:15px}.header-icon{font-size:24px}.main{padding:15px 20px 90px}.categories{display:flex;gap:20px;min-width:max-content;overflow-x:auto;padding-bottom:4px}.category-image{width:100px;height:100px}.products{grid-template-columns:repeat(3,1fr)}.sale-banner{height:100px}}
@media(max-width:600px){.header{padding:10px 15px}.logo-text h1{font-size:21px}.logo-text p{display:none}.profile{width:38px;height:38px}.header-actions{gap:12px}.header-actions .header-icon:nth-child(2){display:none}.search-box{height:40px}.main{padding:14px 12px 85px}.section-title h2{font-size:21px}.see-all{font-size:14px}.category-image{width:82px;height:82px}.category p{font-size:13px}.filter-area{overflow-x:auto;justify-content:flex-start;gap:10px}.filter-left{gap:8px}.filter-btn{min-width:110px;height:38px;font-size:13px}.filters-main{margin-left:auto}.products{grid-template-columns:repeat(2,1fr);gap:10px}.product-image{height:180px}}
</style>

let nextId = generatedProducts.length + 1;

const styles = ["Classic", "Printed", "Designer", "Premium", "Festive", "Casual", "New Collection"];

const productsGrid = document.getElementById("productsGrid");
const searchInput = document.getElementById("searchInput");
const categoryDropdown = document.getElementById("categoryDropdown");
const sortLabel = document.getElementById("sortLabel");
const categoryLabel = document.getElementById("categoryLabel");
const genderLabel = document.getElementById("genderLabel");

let activeFilters = {
    minPrice: 0,
    maxPrice: Infinity,
    category: "",
    gender: "",
    search: ""
};

if (categoryDropdown) {
    categories.forEach(category => {
        const b = document.createElement("button");
        b.className = "filter-option";
        b.type = "button";
        b.textContent = "👗 " + category;
        b.onclick = () => filterCategory(category, category);
        categoryDropdown.appendChild(b);
    });
}

document.querySelectorAll(".category").forEach(item => {
    item.addEventListener("click", () => {
        filterCategory(item.dataset.category, item.dataset.category);
        const trending = document.querySelector(".trending");
        if (trending) trending.scrollIntoView({ behavior: "smooth", block: "start" });
    });
});

function formatReviews(n) {
    return n >= 1000 ? (n / 1000).toFixed(1).replace(".0", "") + "k" : n;
}

function getWishlist() {
    try {
        return JSON.parse(localStorage.getItem("buynestWishlist") || "[]");
    } catch (e) {
        return [];
    }
}

function setWishlistButton(btn, active) {
    if (!btn) return;
    btn.classList.toggle("active", active);
    const i = btn.querySelector("i");
    if (!i) return;
    i.classList.toggle("bi-heart-fill", active);
    i.classList.toggle("bi-heart", !active);
}

function toggleWishlist(product, btn) {
    let list = getWishlist();
    const index = list.findIndex(x => Number(x.id) === Number(product.id));

    if (index >= 0) {
        list.splice(index, 1);
        setWishlistButton(btn, false);
    } else {
        list.push(product);
        setWishlistButton(btn, true);
    }

    localStorage.setItem("buynestWishlist", JSON.stringify(list));
}

function restoreWishlistState() {
    const ids = new Set(getWishlist().map(x => Number(x.id)));
    document.querySelectorAll(".product").forEach(card => {
        setWishlistButton(
            card.querySelector(".wishlist"),
            ids.has(Number(card.dataset.id))
        );
    });
}

function renderProducts(list) {
    if (!productsGrid) return;

    productsGrid.innerHTML = "";

    list.forEach(product => {
        const card = document.createElement("div");
        card.className = "product";
        card.dataset.id = product.id;

        card.innerHTML = `
            <div class="product-image">
                <img src="${product.image}" alt="${product.name}" loading="lazy">
                <button class="wishlist" type="button" aria-label="Add to wishlist">
                    <i class="bi bi-heart"></i>
                </button>
            </div>
            <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="rating">
                    <i class="bi bi-star-fill"></i>
                    <span class="rating-number">${product.rating}</span>
                    <span class="reviews">(${formatReviews(product.reviews)})</span>
                </div>
                <div class="price">
                    ₹${Number(product.price).toLocaleString("en-IN")}
                    <span class="old-price">₹${Number(product.oldPrice).toLocaleString("en-IN")}</span>
                </div>
                <span class="discount">${product.discount}% OFF</span>
            </div>
        `;

        productsGrid.appendChild(card);

        const wishlistButton = card.querySelector(".wishlist");
        wishlistButton.onclick = e => {
            e.stopPropagation();
            toggleWishlist(product, wishlistButton);
        };

        const image = card.querySelector(".product-image img");
        image.onclick = () => {
            localStorage.setItem("buynestSelectedProduct", JSON.stringify(product));
            window.location.href = "product.html?id=" + encodeURIComponent(product.id);
        };
    });

    restoreWishlistState();

    if (!list.length) {
        productsGrid.innerHTML = `
            <div class="no-products">
                <h3>No products found</h3>
                <p>Try another price range, category, gender or search.</p>
            </div>
        `;
    }
}

function applyFilters() {
    const s = activeFilters.search.trim().toLowerCase();

    const list = generatedProducts.filter(product => {
        const name = String(product.name || "").toLowerCase();
        const category = String(product.category || "").toLowerCase();

        return product.price >= activeFilters.minPrice &&
            product.price <= activeFilters.maxPrice &&
            (!activeFilters.category || category === activeFilters.category.toLowerCase()) &&
            (!activeFilters.gender || product.gender === activeFilters.gender) &&
            (!s || name.includes(s) || category.includes(s));
    });

    renderProducts(list);
}

function filterPrice(min, max, label) {
    activeFilters.minPrice = min;
    activeFilters.maxPrice = max;
    if (sortLabel) sortLabel.textContent = label;
    applyFilters();
    closeDropdowns();
}

function filterCategory(category, label) {
    activeFilters.category = category;
    if (categoryLabel) categoryLabel.textContent = label;
    applyFilters();
    closeDropdowns();
}

function filterGender(gender, label) {
    activeFilters.gender = gender;
    if (genderLabel) genderLabel.textContent = label;
    applyFilters();
    closeDropdowns();
}

function toggleFilterDropdown(id) {
    document.querySelectorAll(".filter-dropdown").forEach(d => {
        if (d.id !== id) d.classList.remove("show");
    });

    const dropdown = document.getElementById(id);
    if (dropdown) dropdown.classList.toggle("show");
}

function closeDropdowns() {
    document.querySelectorAll(".filter-dropdown").forEach(d => d.classList.remove("show"));
}

function resetFilters() {
    activeFilters = {
        minPrice: 0,
        maxPrice: Infinity,
        category: "",
        gender: "",
        search: ""
    };

    if (sortLabel) sortLabel.textContent = "Sort";
    if (categoryLabel) categoryLabel.textContent = "Category";
    if (genderLabel) genderLabel.textContent = "Gender";
    if (searchInput) searchInput.value = "";

    renderProducts(generatedProducts);
    closeDropdowns();
}

if (searchInput) {
    searchInput.addEventListener("input", () => {
        activeFilters.search = searchInput.value;
        applyFilters();
    });
}

document.addEventListener("click", e => {
    if (!e.target.closest(".filter-box")) closeDropdowns();
});
